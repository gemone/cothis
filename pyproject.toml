[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
package = false

# Point ty (CLI + LSP) at the uv workspace venv so third-party imports
# resolve everywhere — including the LSP auxiliary scanner, which launches
# ``ty server`` from a cwd where auto-discovery misses ``.venv``. The
# directory (not interpreter) form keeps this portable across OSes: ty
# locates ``bin/python`` / ``Scripts/python.exe`` inside the venv itself.
[tool.ty.environment]
python = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.18",
    "time-machine>=3.2.0",
    "ty>=0.0.51",
]

[tool.ruff.lint]
select = ["I", "TC", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cothis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
