[project]
name = "cothis-ai"
version = "0.1.0"
description = "cothis AI provider abstraction - direct SDKs (anthropic, openai, google-genai, openrouter + openai-compat)"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cothis.ai"
