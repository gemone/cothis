[project]
name = "cothis-protocol"
version = "0.1.0"
description = "cothis protocol - WebSocket transport seam + ACP-ready message/event types"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "anyio>=4.0",
    "pydantic>=2.13.4",
    "websockets>=13.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cothis"
namespace = true
