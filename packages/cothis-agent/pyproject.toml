[project]
name = "cothis-agent"
version = "0.1.0"
description = "cothis agent loop, tools, skills, worker, supervisor (cothis.agent / cothis.tools / cothis.skills / ...)"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "anyio>=4.0",
    "cothis-ai",
    "cothis-protocol",
    "cothis-storage",
    "griffe>=2.1.0",
    "mcp>=1.28.1",
    "pathspec>=0.12.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cothis"
namespace = true

[tool.uv.sources]
cothis-ai = { workspace = true }
cothis-protocol = { workspace = true }
cothis-storage = { workspace = true }
