[project]
name = "cothis-core"
version = "0.1.0"
description = "cothis core (transitional) - agent loop, tools, session, tui, cli; awaiting extraction into dedicated packages"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "cothis-agent",
    "cothis-protocol",
    "cothis-storage",
    "cothis-tui",
    "prompt-toolkit>=3.0",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
cothis = "cothis.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cothis"
namespace = true

[tool.uv.sources]
cothis-ai = { workspace = true }
cothis-agent = { workspace = true }
cothis-protocol = { workspace = true }
cothis-storage = { workspace = true }
cothis-tui = { workspace = true }
